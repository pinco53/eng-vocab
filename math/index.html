const neg=n=>n<0?"−"+Math.abs(n):""+n;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function frac(n,d){if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;n/=g;d/=g;return d===1?neg(n):(n<0?"−":"")+F(Math.abs(n),d)}
function lin(k,m){let s=k===0?"":(k===1?"":k===-1?"−":neg(k))+X;if(m)s+=(s?(m<0?"−":"+"):(m<0?"−":""))+Math.abs(m);return s||"0"}
const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickNZ=(a,b,ex=[])=>{let v;do{v=r(a,b)}while(v===0||ex.includes(v));return v};

 return {q:`(${a}${X}+${b})−(${C}${X}+${d}) のかっこをはずすと？`,o:[`${a}${X}+${b}−${C}${X}+${d}`,`${a}${X}+${b}−${C}${X}−${d}`],a:1,s:[`−( )は、中の符号をすべて変えてはずす`,`=${a}${X}+${b}−${C}${X}−${d}`,`=${lin(a-c,b-d)}`]}}
function g12(){const k=r(2,6),m=r(1,7);
 return {q:`−${k}(${X}+${m}) の計算をすると？`,o:[`−${k}${X}+${m}`,`−${k}${X}+${k*m}`,`−${k}${X}−${k*m}`],a:2,s:[`=−${k}×${X}+(−${k})×${m}`,`=−${k}${X}−${k*m}`]}}
function g14(){const a=r(2,9),b=pickNZ(-6,6);
 return {q:`方程式 ${X}−${a}=${neg(b)} を解くと？`,o:[`${X}=${neg(b+a)}`,`${X}=${neg(b-a)}`],a:0,s:[`${X}=${neg(b)}+${a}　（−${a}を移項すると +${a}）`,`${X}=${neg(b+a)}`]}}
function g15(){let a,s,b,c;do{a=r(2,5);s=pickNZ(-4,6);b=r(1,9);c=a*s-b}while((c-b)%a===0&&(c-b)/a===s);
 return {q:`方程式 ${a}${X}−${b}=${neg(c)} を解くと？`,o:[`${X}=${neg(s)}`,`${X}=${frac(c-b,a)}`],a:0,s:[`${a}${X}=${neg(c)}+${b}　（移項）`,`${a}${X}=${neg(c+b)}`,`${X}=${neg(s)}　（${a}でわる）`]}}
function g17(){const k=r(2,9),m=r(1,6),n=r(1,9);
 return {q:`方程式 0.${k}${X}+${m}=0.${n} の係数を整数になおすと？`,o:[`${k}${X}+${m}=${n}`,`${k}${X}+${m*10}=${n}`],a:1,s:[`両辺に10をかける（整数の${m}にも10をかける）`,`0.${k}${X}×10+${m}×10=0.${n}×10`,`${k}${X}+${m*10}=${n}`]}}
function g18(){const P=[[2,3],[3,4],[4,5],[2,5],[3,5]][r(0,4)],p=P[0],q=P[1],L=p*q,c=r(1,5);
 return {q:`方程式 ${F(X,p)}=${c}+${F(X,q)} の係数を整数になおすと？`,o:[`${q}${X}=${c}+${p}${X}`,`${q}${X}=${c*L}+${p}${X}`],a:1,s:[`分母${p}と${q}の最小公倍数 ${L} を両辺にかける（整数にも）`,`${q}${X}=${c*L}+${p}${X}`,`${X}=${c*L/(q-p)}`]}}
function g20(){const a=pickNZ(-4,4,[1]),s=[2,3,4,-2][r(0,3)],y=a*s;
 return {q:`${Y}は${X}に比例し、${X}=${neg(s)} のとき ${Y}=${neg(y)} です。${Y}を${X}の式で表すと？`,o:[`${Y}=${a===-1?"−":neg(a)}${X}`,`${Y}=${frac(1,a)}${X}`],a:0,s:[`${Y}=${A}${X} に代入：${neg(y)}=${A}×(${neg(s)})`,`${A}=${neg(a)}`,`${Y}=${a===-1?"−":neg(a)}${X}`]}}
function g21(){const s=[2,3,4][r(0,2)],t=pickNZ(-6,6),k=s*t;
 return {q:`${Y}は${X}に反比例し、${X}=${s} のとき ${Y}=${neg(t)} です。${Y}を${X}の式で表すと？`,o:[`${Y}=${frac(t,s)}${X}`,`${Y}=${k<0?"−":""}${F(Math.abs(k),X)}`],a:1,s:[`${Y}=${F(A,X)} に代入：${neg(t)}=${F(A,s)}`,`${A}=${neg(t)}×${s}=${neg(k)}`,`${Y}=${k<0?"−":""}${F(Math.abs(k),X)}`]}}
function g39(){const n=r(25,75)*10;
 return {q:`ある実験を1000回したら、ことがらAが${n}回起こりました。Aが起こる確率はいくつと考えられる？`,o:[`${n/1000}`,`${n}`],a:0,s:[`${n}÷1000＝${n/1000}`]}}
// ===== 保存 =====
const KEY="math1-cards-v1";let mem=null;
function loadS(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return mem}}
function saveS(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=S}}
let S=loadS()||{};S.c=S.c||{};S.days=S.days||[];S.log=S.log||{};S.set=S.set||{newPerDay:3,unit:""};
const GAP=[0,2,4,8,16,32];
const $=()=>document.getElementById("app");
const dstr=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return dstr(d)};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const st=k=>S.c[k.id];const lvOf=k=>st(k)?st(k).lv:0;
const cards=()=>S.set.unit?CARDS.filter(k=>""+k.u===S.set.unit):CARDS;
function streak(){let n=0,d=dstr();const ds=new Set(S.days);if(!ds.has(d))d=addDays(d,-1);while(ds.has(d)){n++;d=addDays(d,-1)}return n}
// ①カードの問題 ②数字を変えた類題（ないカードは同じ問題をもう一度）。②まで正解したら、間をあけて復習
function grade(k,stage,ok,hinted){const t=dstr();const c=S.c[k.id]||(S.c[k.id]={lv:0,box:0,first:t,e:0,h:0});
 const L=S.log[t]||(S.log[t]={ok:0,ng:0,hint:0});if(!S.days.includes(t))S.days.push(t);
 if(ok&&!hinted){L.ok++;c.lv=Math.max(c.lv,stage);c.f=false;if(stage>=2&&c.lv>=2){c.box=Math.min(5,(c.box||0)+1);c.due=addDays(t,GAP[c.box])}else c.due=addDays(t,1)}
 else if(ok){L.hint++;c.h++;c.due=addDays(t,1)}
 else{L.ng++;c.e++;c.f=true;c.box=0;c.due=addDays(t,1);if(c.lv>=2)c.lv=1}
 saveS()}
function plan(){const t=dstr(),cs=cards();const due=cs.filter(k=>st(k)&&st(k).due<=t);
 const todayNew=Object.values(S.c).filter(c=>c.first===t).length;const bonus=(S.bonus&&S.bonus.date===t)?S.bonus.n:0;
 const rest=cs.filter(k=>!st(k));return {due,fresh:rest.slice(0,Math.max(0,(S.set.newPerDay||3)+bonus-todayNew)),left:rest.length}}
// ===== ホーム =====
let ses=null;
function home(){ses=null;const p=plan(),cs=CARDS.filter(k=>st(k)),ok2=cs.filter(k=>lvOf(k)>=2).length;const rev=Math.min(p.due.length,10),any=rev+p.fresh.length>0;
 $().innerHTML=`<h1 style="font-size:20px;margin:6px 0 2px">中1数学カード</h1><div class="dim">選ぶ → 解説で確かめる → ノートに書く</div>
 <div class="box"><div class="big3"><div><b>${cs.length}</b><span class="dim">はじめた</span></div><div><b>${ok2}</b><span class="dim">できる</span></div><div><b>${streak()}</b><span class="dim">日つづけた</span></div></div>
 <div class="bar" style="margin-top:14px"><i style="width:${cs.length/CARDS.length*100}%"></i></div><div class="dim center" style="margin-top:4px">全${CARDS.length}問（カード10〜39）</div></div>
 ${any?`<button class="main" onclick="start()">今日の学習をはじめる</button><div class="dim center" style="margin-top:8px">復習 ${rev}問 ＋ 新しいカード ${p.fresh.length}問</div>`
 :`<div class="box center"><div style="font-size:40px">🎉</div><b>今日の分はおわり！</b><div class="dim">つづきは明日。</div></div>${p.left?`<button class="full" onclick="more()">あと3問すすめる</button>`:""}`}
 <button class="full" style="margin-top:22px" onclick="record()">📒 学習の記録を見る</button>
 <div class="center" style="margin-top:6px"><button class="ghost" onclick="settings()">⚙ 設定</button></div><div class="dim center">版 1</div>`}
function more(){const t=dstr();S.bonus={date:t,n:((S.bonus&&S.bonus.date===t)?S.bonus.n:0)+3};saveS();start()}
// ===== 学習の流れ =====
function start(list){const p=plan();const src=list?shuf(list):[...shuf(p.due).slice(0,10),...p.fresh];const tasks=[];
 src.filter(k=>lvOf(k)>0).forEach(k=>tasks.push({k,stage:2}));
 const fresh=src.filter(k=>lvOf(k)===0);fresh.forEach(k=>tasks.push({k,stage:1}));
 if(!tasks.length){home();return}ses={tasks,n:tasks.length,done:0,wrong:[]};next()}
function next(){if(!ses)return;if(!ses.tasks.length){end();return}const t=ses.cur=ses.tasks.shift();t.hint=false;ses.locked=false;
 const k=t.k;let pr={q:k.q,o:k.o,a:k.a,s:k.s};if(t.stage===2&&k.gen&&!t.retry)pr=k.gen();else if(t.retry&&t.pr)pr=t.pr;
 t.pr=pr;const order=shuf(pr.o.map((_,i)=>i));ses.order=order;
 $().innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><span class="unit">${UNITS[k.u]}　カード${k.no}${t.stage===2?(k.gen?"　（数字を変えた問題）":"　（もう一度）"):""}</span><button class="ghost" onclick="home()">やめる</button></div>
 <div class="bar"><i style="width:${ses.done/ses.n*100}%"></i></div>
 <div class="box"><div class="ttl">${k.t}</div><div class="q">${pr.q}</div></div>
 <div id="hint"><button class="hintb" onclick="hint()">💡 ヒントを見る</button></div>
 ${order.map((oi,i)=>`<button class="ch" onclick="ans(${i})">${"①②③④"[i]}　${pr.o[oi]}</button>`).join("")}`}
function hint(){if(!ses||ses.locked)return;const t=ses.cur;t.hint=true;document.getElementById("hint").innerHTML=`<div class="tip">🐟 ${t.k.tip}</div>`;
 const bs=[...document.querySelectorAll(".ch")];if(bs.length>=3){const i=ses.order.findIndex((oi,j)=>oi!==t.pr.a&&!bs[j].disabled);if(i>=0){bs[i].classList.add("off");bs[i].disabled=true}}}
function ans(i){if(!ses||ses.locked)return;ses.locked=true;const t=ses.cur,k=t.k,ok=ses.order[i]===t.pr.a;
 [...document.querySelectorAll(".ch")].forEach((b,j)=>{if(ses.order[j]===t.pr.a)b.classList.add("ok");else if(j===i)b.classList.add("ng")});
 if(!t.retry)grade(k,t.stage,ok,t.hint);
 if(!ok){if(!t.retry)ses.wrong.push(k);ses.tasks.splice(Math.min(2,ses.tasks.length),0,{k,stage:t.stage,retry:true,pr:t.pr});ses.n++}
 const my=ses;setTimeout(()=>{if(ses!==my)return;explain(t,ok)},ok?500:800)}
function explain(t,ok){const k=t.k,pr=t.pr;
 $().innerHTML=`<div class="unit">${UNITS[k.u]}　カード${k.no}</div>
 <div class="box center" style="font-size:22px;font-weight:bold;color:${ok?"#15803d":"#b91c1c"}">${ok?(t.hint?"⭕ 正解（ヒントあり）":"⭕ 正解！"):"❌ おしい！"}</div>
 <div class="box"><div class="dim">こたえ</div><div class="q" style="font-weight:bold">${pr.o[pr.a]}</div>
 <div class="tip">🐟 ${k.tip}</div><div class="steps">${pr.s.map(x=>`<div>${x}</div>`).join("")}</div></div>
 ${ok?"":`<div class="note">✏️ 解説を見ながら、ノートに式を書き写そう。あとでもう一度出ます。</div>`}
 <button class="main" onclick="ses.done++;next()">次へ</button>`}
function end(){const u=[...new Map(ses.wrong.map(k=>[k.id,k])).values()],n=ses.n;ses=null;const p=plan();
 $().innerHTML=`<div class="box center"><div style="font-size:48px">🎉</div><h2>おつかれさま！</h2><div>${streak()}日つづいています</div></div>
 ${u.length?`<div class="note"><b>✏️ 自学ノートに書こう</b><br>まちがえた問題を、問題 → 解き方 → 答え の順に書いて、もう一度自分で解こう。<br><br>${u.map(k=>`カード${k.no}　${k.t}`).join("<br>")}</div>`:`<div class="note">ぜんぶ正解！今日のカードの「🐟ポイント」をノートに1行ずつ書いておこう。</div>`}
 ${p.due.length?`<button class="full" style="margin-bottom:10px" onclick="start()">残りの復習 ${p.due.length}問をやる</button>`:(p.left?`<button class="full" style="margin-bottom:10px" onclick="more()">あと3問すすめる</button>`:"")}
 <button class="main" onclick="home()">おわる</button>`}
// ===== 学習の記録（ポートフォリオ） =====
function mark(k){const c=st(k);if(!c)return `<span class="mk dim">まだ</span>`;return `<span class="mk">${c.lv>=1?"①⭕":"①・"} ${c.lv>=2?"②⭕":"②・"}</span>`}
function record(){const cs=CARDS.filter(k=>st(k)),wk=CARDS.filter(k=>st(k)&&st(k).f);
 const days=Object.keys(S.log).sort().slice(-14).reverse();
 $().innerHTML=`<button class="ghost" onclick="home()">◀ もどる</button><h2>📒 学習の記録</h2>
 <div class="box"><b>単元ごとにできるようになった問題</b>${Object.entries(UNITS).map(([u,nm])=>{const all=CARDS.filter(k=>""+k.u===u),ok=all.filter(k=>lvOf(k)>=2).length;return `<div class="lv"><span>${nm}</span><div class="bar"><i style="width:${ok/all.length*100}%"></i></div><b>${ok}/${all.length}</b></div>`}).join("")}
 <div class="dim">「できる」＝カードの問題（①）と、数字を変えた問題またはもう一度（②）を、ヒントなしで正解。</div></div>
 ${wk.length?`<button class="main" style="min-height:58px;font-size:18px" onclick="start(CARDS.filter(k=>st(k)&&st(k).f))">いま つまずいている ${wk.length}問を練習する</button>`:""}
 ${wk.length?`<h3>つまずいている問題</h3><div class="box" style="padding:6px 16px">${wk.map(k=>`<div class="li"><div style="flex:1"><b>カード${k.no}</b>　${k.t}<div class="dim">まちがい${st(k).e}回　ヒント${st(k).h}回</div></div>${mark(k)}</div>`).join("")}</div>`:""}
 ${days.length?`<h3>日ごとの記録</h3><div class="box" style="padding:6px 16px">${days.map(d=>{const l=S.log[d];return `<div class="li"><div style="flex:1">${d.slice(5).replace("-","/")}</div><div class="dim">正解${l.ok}　ヒント${l.hint}　まちがい${l.ng}</div></div>`}).join("")}</div>`:""}
 <h3>カードごとの記録</h3><div class="box" style="padding:6px 16px">${CARDS.map(k=>`<div class="li"><div style="flex:1"><b>${k.no}</b>　${k.t}${st(k)?`<div class="dim">まちがい${st(k).e}回　ヒント${st(k).h}回</div>`:""}</div>${mark(k)}</div>`).join("")}</div>
 <button class="full" onclick="copyRec()">記録を文字でコピーする</button><div id="cp" class="dim center" style="margin-top:6px"></div>`}
function copyRec(){const plain=s=>s.replace(/<[^>]+>/g,"");
 const txt=`【中1数学カード 学習の記録 ${dstr()}】\nはじめた ${CARDS.filter(k=>st(k)).length}問／できる ${CARDS.filter(k=>lvOf(k)>=2).length}問／つづけた日数 ${streak()}日\n`+Object.entries(UNITS).map(([u,nm])=>{const all=CARDS.filter(k=>""+k.u===u);return `${nm}：${all.filter(k=>lvOf(k)>=2).length}/${all.length}`}).join("\n")+`\nつまずき：`+(CARDS.filter(k=>st(k)&&st(k).f).map(k=>`カード${k.no} ${plain(k.t)}（まちがい${st(k).e}回）`).join("、")||"なし");
 const done=m=>{const e=document.getElementById("cp");if(e)e.textContent=m};try{navigator.clipboard.writeText(txt).then(()=>done("コピーしました"),()=>done(txt))}catch(e){done(txt)}}
// ===== 設定 =====
function settings(){$().innerHTML=`<button class="ghost" onclick="home()">◀ もどる</button><h2>⚙ 設定</h2><div class="box">
 <label>1日の新しいカード</label><select onchange="S.set.newPerDay=+this.value;saveS()">${[3,5].map(n=>`<option value="${n}" ${(S.set.newPerDay||3)===n?"selected":""}>${n}問</option>`).join("")}</select>
 <label>単元</label><select onchange="S.set.unit=this.value;saveS()"><option value="">すべて</option>${Object.entries(UNITS).map(([u,nm])=>`<option value="${u}" ${S.set.unit===u?"selected":""}>${nm}</option>`).join("")}</select></div>
 <div class="box" style="font-size:15px;line-height:1.7"><b>この進め方の考え方</b><br>・まず自分で答えを選ぶ（思い出す練習）<br>・すぐに解説で確かめる<br>・次の日に、数字を変えた問題で「わかった」を確かめる<br>・できた問題は、2日・4日・8日…と間をあけて復習<br>・まちがえた問題は、自学ノートに書き写して解き直す</div>`}
home();
</script></body></html>
