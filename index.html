<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英単語">
<meta name="theme-color" content="#0f766e">
<title>中学英単語</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Hiragino Sans",system-ui,sans-serif;background:#f1f5f9;color:#0f172a;
 padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
button{font-family:inherit;font-size:18px;border:0;border-radius:14px;min-height:54px;padding:0 16px;background:#e2e8f0;color:#0f172a;touch-action:manipulation}
.main{width:100%;background:#0f766e;color:#fff;font-weight:bold;min-height:68px;font-size:21px}
.full{width:100%}.ghost{background:none;color:#475569;font-size:15px;min-height:44px}
.box{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 1px 3px #0001}
.center{text-align:center}.dim{color:#64748b;font-size:14px}
.bar{height:10px;background:#cbd5e1;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:#0f766e;transition:width .3s}
.word{font-size:44px;font-weight:bold;word-break:break-word;line-height:1.2}
.mean{font-size:28px;font-weight:bold;color:#b45309}
.step{font-size:13px;color:#0f766e;font-weight:bold;letter-spacing:.05em}
.ch{display:block;width:100%;margin:10px 0;min-height:62px;font-size:20px;background:#fff;border:2px solid #cbd5e1}
.ok{background:#bbf7d0!important;border-color:#16a34a!important}.ng{background:#fecaca!important;border-color:#dc2626!important}
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:14px 0;min-height:52px}
.slot{width:38px;height:50px;border-bottom:3px solid #94a3b8;font-size:30px;font-weight:bold;display:flex;align-items:center;justify-content:center}
.slot.gap{border:0;width:16px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{width:50px;min-height:54px;padding:0;font-size:26px;font-weight:bold;background:#fff;border:2px solid #94a3b8}
.tile.used{opacity:.2}
.row{display:flex;gap:10px}.row>*{flex:1}
.big3{display:flex;justify-content:space-around;text-align:center}.big3 b{display:block;font-size:30px;color:#0f766e}
.note{background:#fef9c3;border-left:5px solid #eab308;border-radius:8px;padding:10px 14px;margin:12px 0;font-size:15px;text-align:left}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #e2e8f0}
select{font-size:17px;padding:8px;border-radius:10px;border:1px solid #94a3b8;background:#fff;max-width:100%}
label{display:block;margin:14px 0 6px;font-weight:bold}
</style></head><body>
<div id="app"><p class="center dim">よみこみ中…</p></div>
<script>
// ===== 保存（これまでの記録と同じ場所を使う） =====
const KEY="eng-vocab-cards-v1";let mem=null;
function loadS(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return mem}}
function saveS(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=S}}
let S=loadS()||{cards:{},days:[],settings:{}};
S.cards=S.cards||{};S.days=S.days||[];S.settings=S.settings||{};
if(!S.v2){S.settings.newPerDay=5;S.v2=true}
const INTERVALS=[0,1,2,4,8,16,32]; // 覚えるほど間があく（日）
const RANGES=[["","すべて"],["1-38","カード1〜38（家族・身の回り・食事）"],["39-78","カード39〜78（動物・場所・時・曜日）"],["79-122","カード79〜122（月・季節・動詞）"],["123-158","カード123〜158（形容詞・疑問詞・前置詞）"]];
const MAX_REVIEW=15;
const $=()=>document.getElementById("app");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dstr=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return dstr(d)};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let all=[],words=[],ses=null;
function applyRange(){let r=S.settings.range;if(!RANGES.some(x=>x[0]===r))r=S.settings.range="";if(!r){words=all;return}const [a,b]=r.split("-").map(Number);words=all.filter(w=>w.no>=a&&w.no<=b)}
// ===== 音声 =====
let au=null;
function play(id,kind){try{if(au)au.pause();au=new Audio("audio/"+kind+"/"+id+".m4a");au.playbackRate=S.settings.slow?0.75:1;const p=au.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
let ac=null;
function beep(f,d,type){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=ac||new A();const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
// ===== 記録 =====
function touchDay(){const t=dstr();if(!S.days.includes(t))S.days.push(t)}
function card(w){return S.cards[w.id]}
function recWrong(w){const t=dstr();const c=S.cards[w.id]||(S.cards[w.id]={box:0,first:t,miss:0});c.box=1;c.miss=(c.miss||0)+1;c.due=addDays(t,1);touchDay();saveS()}
function recRight(w){const t=dstr();const c=S.cards[w.id]||(S.cards[w.id]={box:0,first:t,miss:0});c.box=Math.min(6,(c.box||0)+1);c.due=addDays(t,INTERVALS[c.box]);touchDay();saveS()}
function streak(){let n=0,d=dstr();const ds=new Set(S.days);if(!ds.has(d))d=addDays(d,-1);while(ds.has(d)){n++;d=addDays(d,-1)}return n}
const weak=()=>all.filter(w=>{const c=card(w);return c&&c.miss>0&&c.box<=2});
function plan(){const t=dstr();
 const due=words.filter(w=>{const c=card(w);return c&&c.due<=t});
 const todayNew=Object.values(S.cards).filter(c=>c.first===t).length;
 const bonus=(S.bonus&&S.bonus.date===t)?S.bonus.n:0;
 const n=Math.max(0,(S.settings.newPerDay||5)+bonus-todayNew);
 const fresh=words.filter(w=>!card(w)).slice(0,n);
 return {due,fresh,left:words.filter(w=>!card(w)).length}}
// ===== ホーム =====
function home(){ses=null;const p=plan(),cs=all.filter(w=>card(w)),strong=cs.filter(w=>card(w).box>=4).length,wk=weak().length;
 const rev=Math.min(p.due.length,MAX_REVIEW),any=rev+p.fresh.length>0;
 $().innerHTML=`<h1 style="font-size:20px;margin:6px 0 2px">中学英単語</h1><div class="dim">1日5分。ボタンを押すだけ。</div>
 <div class="box"><div class="big3"><div><b>${cs.length}</b><span class="dim">はじめた</span></div><div><b>${strong}</b><span class="dim">しっかり覚えた</span></div><div><b>${streak()}</b><span class="dim">日つづけた</span></div></div>
 <div class="bar" style="margin-top:14px"><i style="width:${all.length?cs.length/all.length*100:0}%"></i></div><div class="dim center" style="margin-top:4px">全${all.length}語</div></div>
 ${any?`<button class="main" onclick="start()">今日の学習をはじめる</button><div class="dim center" style="margin-top:8px">復習 ${rev}語 ＋ 新しい単語 ${p.fresh.length}語${p.due.length>rev?`（復習の残り ${p.due.length-rev}語は次の回に）`:""}</div>`
 :`<div class="box center"><div style="font-size:40px">🎉</div><b>今日の分はおわり！</b><div class="dim">また明日。復習は明日から出ます。</div></div>
 ${p.left?`<button class="full" onclick="more()">あと5語すすめる</button>`:""}`}
 <div style="margin-top:22px">${wk?`<button class="full" onclick="weakList()">📕 わからなかった単語（${wk}語）</button>`:""}</div>
 <div class="center" style="margin-top:6px"><button class="ghost" onclick="settings()">⚙ 設定</button></div>`}
function more(){const t=dstr();S.bonus={date:t,n:((S.bonus&&S.bonus.date===t)?S.bonus.n:0)+5};saveS();start()}
// ===== 学習の流れ：復習 → 新しい単語（見る・聞く → 選ぶ → つづる） =====
const canSpell=w=>/^[A-Za-z' ]+$/.test(w.word)&&w.word.replace(/ /g,"").length<=12;
const recall=w=>canSpell(w)?"spell":"pick";
function start(list){const p=plan();let tasks=[],ws=[];
 if(list){ws=shuf(list);tasks=ws.map(w=>({w,type:recall(w)}))}
 else{const due=shuf(p.due).slice(0,MAX_REVIEW);ws=[...due,...p.fresh];
  tasks=due.map(w=>({w,type:recall(w)}));
  p.fresh.forEach(w=>{tasks.push({w,type:"intro"});tasks.push({w,type:"choice"})});
  shuf(p.fresh).forEach(w=>tasks.push({w,type:recall(w)}))}
 if(!tasks.length){home();return}
 ses={tasks,st:{},total:ws.length,finished:0,wrong:[],cur:null,locked:false,practice:!!list};
 ws.forEach(w=>ses.st[w.id]={wrong:false,need:0});next()}
function next(){if(!ses)return;if(!ses.tasks.length){end();return}
 ses.cur=ses.tasks.shift();ses.locked=false;({intro,choice,spell,pick})[ses.cur.type](ses.cur.w)}
const head=label=>`<div style="display:flex;justify-content:space-between;align-items:center"><span class="step">${label}</span><button class="ghost" style="min-height:32px" onclick="home()">やめる</button></div>
 <div class="bar"><i style="width:${ses.total?ses.finished/ses.total*100:0}%"></i></div>`;
function again(t,pos){ses.tasks.splice(Math.min(pos,ses.tasks.length),0,t)}
function finishWord(w){ses.finished++}
// 1) 見る・聞く
function intro(w){$().innerHTML=`${head("① 見る・聞く")}
 <div class="box center"><div class="dim">${w.no?"カード "+w.no:""}</div><div class="word">${esc(w.word)}</div><div class="mean" style="margin-top:8px">${esc(w.meaning)}</div>
 <button style="margin:14px 0" onclick="play('${w.id}','w')">🔊 もう一度聞く</button>
 ${w.phrase?`<div style="font-size:20px">${esc(w.phrase)}</div><div class="dim">${esc(w.phraseJa||"")}</div>`:""}
 ${w.example?`<div style="font-size:17px;margin-top:10px">${esc(w.example)}</div><div class="dim">${esc(w.exampleJa||"")}</div>`:""}</div>
 <div class="dim center" style="margin-bottom:10px">声に出して1回言ってみよう</div>
 <button class="main" onclick="next()">次へ</button>`;setTimeout(()=>{if(ses&&ses.cur&&ses.cur.w===w)play(w.id,"w")},150)}
// 2) 選ぶ（英語→意味）／つづれない語の思い出し（意味→英語）
function options(w,key){const pool=shuf(all.filter(x=>x.id!==w.id&&x[key]!==w[key]));
 return shuf([w,...[...pool.filter(x=>x.pos===w.pos),...pool.filter(x=>x.pos!==w.pos)].slice(0,3)])}
function choice(w){ses.opts=options(w,"meaning");$().innerHTML=`${head("② 意味を選ぶ")}
 <div class="box center"><div class="word">${esc(w.word)}</div><button style="margin-top:10px" onclick="play('${w.id}','w')">🔊</button></div>
 ${ses.opts.map((o,i)=>`<button class="ch" onclick="pickAns(${i})">${esc(o.meaning)}</button>`).join("")}`;setTimeout(()=>{if(ses&&ses.cur&&ses.cur.w===w)play(w.id,"w")},150)}
function pick(w){ses.opts=options(w,"word");$().innerHTML=`${head("③ 英語を思い出す")}
 <div class="box center"><div class="dim">この意味の英語は？</div><div class="mean" style="margin-top:6px">${esc(w.meaning)}</div></div>
 ${ses.opts.map((o,i)=>`<button class="ch" onclick="pickAns(${i})">${esc(o.word)}</button>`).join("")}`}
function pickAns(i){if(!ses||ses.locked)return;ses.locked=true;const t=ses.cur,w=t.w,ok=ses.opts[i].id===w.id;
 [...document.querySelectorAll(".ch")].forEach((b,k)=>{if(ses.opts[k].id===w.id)b.classList.add("ok");else if(k===i)b.classList.add("ng")});
 result(ok)}
// 3) つづる（文字タイル）
let sp=null;
function spell(w){const chars=w.word.split("");const letters=chars.filter(c=>c!==" ");
 const extra=shuf("aeioustrnlmdhc".split("")).filter(c=>!letters.includes(c)).slice(0,letters.length>=3?2:1);
 sp={chars,letters,pos:[],tiles:shuf([...letters,...extra]).map(ch=>({ch,used:false}))};drawSpell(w)}
function drawSpell(w){let k=0;
 const slots=sp.chars.map(c=>c===" "?`<div class="slot gap"></div>`:`<div class="slot">${esc(sp.pos[k]!==undefined?sp.tiles[sp.pos[k++]].ch:(k++,""))}</div>`).join("");
 $().innerHTML=`${head("③ 英語をつづる")}
 <div class="box center"><div class="dim">この意味の英語は？</div><div class="mean" style="margin-top:6px">${esc(w.meaning)}</div>
 <div class="slots">${slots}</div><div id="fb"></div></div>
 <div class="tiles">${sp.tiles.map((t,i)=>`<button class="tile ${t.used?"used":""}" onclick="tap(${i})">${esc(t.ch)}</button>`).join("")}</div>
 <div class="row" style="margin-top:14px"><button onclick="undo()">⌫ 1文字もどす</button><button onclick="giveUp()">わからない</button></div>`}
function tap(i){if(!ses||ses.locked||sp.tiles[i].used)return;sp.tiles[i].used=true;sp.pos.push(i);const w=ses.cur.w;drawSpell(w);
 if(sp.pos.length===sp.letters.length){ses.locked=true;result(sp.pos.map(k=>sp.tiles[k].ch).join("")===sp.letters.join(""))}}
function undo(){if(!ses||ses.locked||!sp.pos.length)return;sp.tiles[sp.pos.pop()].used=false;drawSpell(ses.cur.w)}
function giveUp(){if(!ses||ses.locked)return;ses.locked=true;result(false)}
// 正解・不正解の処理（ここで復習の間隔が決まる）
function result(ok){const t=ses.cur,w=t.w,st=ses.st[w.id],my=ses;
 if(ok){beep(660,.09);setTimeout(()=>beep(990,.12),80);play(w.id,"w");
  if(t.type!=="choice"){
   if(st.need>0){st.need--;if(st.need>0)again({w,type:t.type},3);else finishWord(w)}
   else{if(!st.wrong)recRight(w);finishWord(w)}}
  setTimeout(()=>{if(ses===my)next()},800);return}
 beep(170,.25,"sawtooth");
 if(!st.wrong){st.wrong=true;recWrong(w);ses.wrong.push(w)}
 if(t.type==="choice")again({w,type:"choice"},2);else{st.need=2;again({w,type:t.type},3)}
 setTimeout(()=>{if(ses!==my)return;play(w.id,"w");
  $().innerHTML=`${head("こたえ")}<div class="box center"><div class="word">${esc(w.word)}</div><div class="mean" style="margin-top:8px">${esc(w.meaning)}</div>
  <button style="margin:14px 0" onclick="play('${w.id}','w')">🔊 もう一度聞く</button>
  ${w.phrase?`<div style="font-size:20px">${esc(w.phrase)}</div><div class="dim">${esc(w.phraseJa||"")}</div>`:""}</div>
  <div class="dim center" style="margin-bottom:10px">つづりをよく見てから進もう。あとでもう一度出ます。</div>
  <button class="main" onclick="next()">次へ</button>`},t.type==="spell"?250:700)}
function end(){const u=ses.wrong,n=ses.total;ses=null;const p=plan();beep(523,.15);setTimeout(()=>beep(784,.2),140);
 $().innerHTML=`<div class="box center"><div style="font-size:48px">🎉</div><h2 style="margin:6px 0">おつかれさま！</h2>
 <div>${n}語 学習しました ／ ${streak()}日つづいています</div></div>
 ${u.length?`<div class="note"><b>✏️ ノートに3回ずつ書こう</b><br>${u.map(w=>`${esc(w.word)}　${esc(w.meaning)}`).join("<br>")}</div>`:`<div class="note">ぜんぶ正解！ノートに今日の単語を1回ずつ書いておこう。</div>`}
 ${p.due.length?`<button class="full" style="margin-bottom:10px" onclick="start()">復習の残り ${p.due.length}語をやる</button>`:(p.left?`<button class="full" style="margin-bottom:10px" onclick="more()">あと5語すすめる</button>`:"")}
 <button class="main" onclick="home()">おわる</button>`}
// ===== わからなかった単語 =====
function weakList(){const ws=weak();$().innerHTML=`<button class="ghost" onclick="home()">◀ もどる</button><h2 style="margin:4px 0">📕 わからなかった単語（${ws.length}語）</h2>
 <div class="dim">正解を重ねると、ここから自動で消えます。</div>
 ${ws.length?`<button class="main" style="margin:14px 0" onclick="start(weak())">この単語だけ練習する</button>`:""}
 <div class="box">${ws.map(w=>`<div class="li"><button style="min-height:44px;width:52px;padding:0" onclick="play('${w.id}','w')">🔊</button><div><b style="font-size:20px">${esc(w.word)}</b>　${esc(w.meaning)}<div class="dim">${esc(w.phrase||"")}　まちがい ${card(w).miss}回</div></div></div>`).join("")||"ありません"}</div>`}
// ===== 設定 =====
function settings(){$().innerHTML=`<button class="ghost" onclick="home()">◀ もどる</button><h2 style="margin:4px 0">⚙ 設定</h2><div class="box">
 <label>1日の新しい単語</label><select onchange="setv('newPerDay',+this.value)">${[5,10].map(n=>`<option value="${n}" ${(S.settings.newPerDay||5)===n?"selected":""}>${n}語</option>`).join("")}</select>
 <label>範囲（重要単語カードの番号）</label><select onchange="setv('range',this.value)">${RANGES.map(([v,l])=>`<option value="${v}" ${(S.settings.range||"")===v?"selected":""}>${l}</option>`).join("")}</select>
 <label>音声の速さ</label><select onchange="setv('slow',this.value==='1')"><option value="0" ${S.settings.slow?"":"selected"}>ふつう</option><option value="1" ${S.settings.slow?"selected":""}>ゆっくり</option></select>
 </div><div class="dim">新しい単語は、重要単語カード（中1英語）の番号順に出ます。記録はこのスマホの中に保存されます。</div>`}
function setv(k,v){S.settings[k]=v;saveS();if(k==="range")applyRange()}
fetch("words.json").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(j=>{all=j;applyRange();home()})
 .catch(e=>{$().innerHTML='<div class="box">単語データを読み込めません：'+esc(e.message)+'</div>'});
</script></body></html>
