<script>
// ===== 中2 英文法カード（英語要点まとめシートⒶⒷより） =====
const UNITS={1:"There is[are]",2:"未来の文",3:"いろいろな文の形",4:"助動詞",5:"不定詞",6:"動名詞",7:"接続詞",8:"比較",9:"受け身"};
const B="（　　）";
const C=(id,u,t,q,o,a,tip,s,say)=>({id,no:+id,u,t,q,o,a,tip,s,say});
const CARDS=[
C("1",1,"There is",`${B} a cat under the table.`,["There is","There are","It is"],0,"There is[are]＋主語＋場所。主語が1つなら is",["There is＋1つのもの","There are＋2つ以上のもの","There is a cat under the table.（テーブルの下にネコがいます）"],"There is a cat under the table."),
C("2",1,"There are",`There ${B} three books on the desk.`,["is","are","am"],1,"主語が2つ以上なら are",["three books は複数 → are","There are three books on the desk.（机の上に本が3冊あります）"],"There are three books on the desk."),
C("3",1,"There is の疑問文",`${B} there a park near here? — Yes, there is.`,["Is","Are","Do"],0,"疑問文は Is[Are] there 〜?",["疑問文：Is[Are]＋there＋主語＋場所？","答え：Yes, there is. / No, there is not."],"Is there a park near here? Yes, there is."),
C("4",1,"There is を使わないとき","「イスの下に私のネコがいます」を正しく表すのは？",["There is my cat under the chair.","My cat is under the chair."],1,"the や my のついた特定のものが主語のときは使わない",["× There is my cat 〜","○ My cat is under the chair."],"My cat is under the chair."),
C("5",2,"will",`I ${B} visit Kyoto tomorrow.`,["will","am","was"],0,"will＋動詞の原形 … 意志や未来",["主語＋will＋動詞の原形","I will visit Kyoto tomorrow.（明日京都を訪れます）"],"I will visit Kyoto tomorrow."),
C("6",2,"be going to",`We are ${B} to play tennis this afternoon.`,["going","go","went"],0,"be going to＋動詞の原形 … 予定",["主語＋be動詞＋going to＋動詞の原形","予定や、今から予測される未来を表す"],"We are going to play tennis this afternoon."),
C("7",2,"will の否定文",`「明日は雨は降らないでしょう」It ${B} rain tomorrow.`,["won't","isn't","don't"],0,"will not＝won't",["主語＋will not[won't]＋動詞の原形"],"It won't rain tomorrow."),
C("8",3,"主語＋動詞＋補語",`Ken looked ${B}.`,["happy","happily"],0,"look＋形容詞 で「〜に見える」",["主語＋動詞＋補語（形容詞）","Ken looked happy.（ケンは幸せそうだった）"],"Ken looked happy."),
C("9",3,"目的語が2つの文","「タクはマイにその本をあげました」を正しく表すのは？",["Taku gave Mai the book.","Taku gave the book Mai."],0,"give＋人＋もの",["主語＋動詞＋目的語（人）＋目的語（もの）","Taku gave Mai the book."],"Taku gave Mai the book."),
C("10",3,"主語＋動詞＋目的語＋補語","「私たちはそのネコをモモと呼びます」を正しく表すのは？",["We call the cat Momo.","We call Momo the cat."],0,"call＋A＋B で「AをBと呼ぶ」",["主語＋動詞＋目的語＋補語","We call the cat Momo."],"We call the cat Momo."),
C("11",4,"can（依頼）",`「手伝ってくれますか」${B} you help me?`,["Can","Must","Shall"],0,"Can you 〜? … 依頼",["Can you 〜?「〜してくれますか」","Can I 〜?「〜してもいいですか」"],"Can you help me?"),
C("12",4,"Could you",`ていねいにお願いするときは？ ${B} open the door?`,["Could you","Must you","Do you"],0,"can の過去形 could。Could you 〜? はていねいな依頼",["Could you open the door?（ドアを開けていただけますか）"],"Could you open the door?"),
C("13",4,"must",`「宿題をしなければなりません」I ${B} do my homework.`,["must","may","can"],0,"must ≒ have to「〜しなければならない」",["主語＋must＋動詞の原形","I must do my homework. ＝ I have to do my homework."],"I must do my homework."),
C("14",4,"must not と don't have to","「あなたは急ぐ必要はありません」を表すのは？",["You don't have to hurry.","You must not hurry."],0,"don't have to は「〜する必要はない」",["must not … 〜してはいけない","don't have to … 〜する必要はない"],"You don't have to hurry."),
C("15",4,"must not","「ここで泳いではいけません」を表すのは？",["You must not swim here.","You don't have to swim here."],0,"must not[mustn't] は「〜してはいけない」",["must not … 禁止","don't have to … 必要がない"],"You must not swim here."),
C("16",4,"had to","「昨日は早く起きなければなりませんでした」を表すのは？",["I had to get up early yesterday.","I must get up early yesterday."],0,"must には過去形がない → had to",["過去の文では had to＋動詞の原形"],"I had to get up early yesterday."),
C("17",4,"Shall I 〜?",`「窓を開けましょうか」（申し出） ${B} open the window?`,["Shall I","Shall we","Will you"],0,"Shall I 〜? … 申し出",["Will you 〜? … 依頼","Shall I 〜? … 申し出","Shall we 〜? … 勧誘","May I 〜? … 許可"],"Shall I open the window?"),
C("18",4,"Shall we 〜?",`「いっしょにおどりましょうか」 ${B} dance?`,["Shall we","Shall I","May I"],0,"Shall we 〜? … 勧誘（いっしょに）",["Shall we dance?（おどりませんか）"],"Shall we dance?"),
C("19",4,"May I 〜?",`「入ってもいいですか」 ${B} come in?`,["May I","Will you","Shall we"],0,"May I 〜? … 許可を求める",["May I come in?（入ってもいいですか）"],"May I come in?"),
C("20",4,"should",`「あなたは家に帰るべきです」You ${B} go home.`,["should","may","won't"],0,"should「〜すべきだ」",["should＋動詞の原形 … 〜すべきだ","may … 〜してもよい／〜かもしれない"],"You should go home."),
C("21",5,"不定詞（名詞的用法）","I want to be a doctor. の to be の使い方は？",["〜すること（名詞的用法）","〜するための（形容詞的用法）","〜するために（副詞的用法）"],0,"want の目的語「〜すること」",["名詞的用法 … 〜すること","I want to be a doctor.（医者になりたい）"],"I want to be a doctor."),
C("22",5,"不定詞（形容詞的用法）","I have a lot of homework to do. の to do の使い方は？",["〜すること（名詞的用法）","〜するべき（形容詞的用法）","〜するために（副詞的用法）"],1,"名詞（homework）を後ろから説明",["形容詞的用法 … 〜する[ための]・〜すべき","homework to do（するべき宿題）"],"I have a lot of homework to do."),
C("23",5,"不定詞（副詞的用法）","I went to the library to study. の to study の使い方は？",["〜すること（名詞的用法）","〜するための（形容詞的用法）","〜するために（副詞的用法）"],2,"動詞（went）に目的を加える",["副詞的用法 … ①〜するために（目的）②〜して（原因）"],"I went to the library to study."),
C("24",5,"疑問詞＋to",`「私はそれの使い方を知っています」I know ${B} to use it.`,["how","what","where"],0,"how to 〜「〜のしかた」",["how to 〜 … 〜のしかた","what to 〜 … 何を〜すべきか","Tell me what to do.（何をすべきか教えて）"],"I know how to use it."),
C("25",5,"It is 〜 for … to",`It is easy ${B} me to use a computer.`,["for","of","to"],0,"It is＋形容詞＋for 人＋to＋動詞の原形",["「（…にとって）〜することは―だ」","よく使う形容詞：difficult, important, necessary"],"It is easy for me to use a computer."),
C("26",6,"前置詞＋動名詞",`Thank you for ${B} me.`,["call","calling","to call"],1,"前置詞のあとは動名詞（-ing）",["動名詞は前置詞のあとに置ける（不定詞は置けない）","Thank you for calling me.（電話してくれてありがとう）"],"Thank you for calling me."),
C("27",6,"enjoy＋動名詞",`I enjoyed ${B} soccer.`,["playing","to play"],0,"enjoy・finish・stop は動名詞だけ",["動名詞だけ：enjoy, finish, stop","不定詞だけ：want, hope, decide","両方OK：like, start[begin], continue"],"I enjoyed playing soccer."),
C("28",6,"want＋不定詞",`I want ${B} a new bike.`,["to buy","buying"],0,"want・hope・decide は不定詞だけ",["不定詞だけ：want, hope, decide","動名詞だけ：enjoy, finish, stop"],"I want to buy a new bike."),
C("29",6,"前置詞＋動名詞の重要表現",`「私は泳ぐのが得意です」I am good ${B} swimming.`,["at","for","in"],0,"be good at 〜ing「〜するのが得意だ」",["be good at 〜ing … 〜するのが得意だ","without 〜ing … 〜しないで","Thank you for 〜ing … 〜してくれてありがとう"],"I am good at swimming."),
C("30",7,"if のあとの時制",`If it ${B} fine tomorrow, let's go to the zoo.`,["is","will be"],0,"時や条件を表す when・if のあとは、未来でも現在形",["If it is fine tomorrow, let's go to the zoo.（もし明日晴れたら動物園に行こう）"],"If it is fine tomorrow, let's go to the zoo."),
C("31",7,"when",`「私が家に着いたとき、弟はテレビを見ていました」${B} I got home, my brother was watching TV.`,["When","If","Because"],0,"when「〜するとき」。文の前半に置くときはカンマが必要",["When I got home, my brother was watching TV.","＝ My brother was watching TV when I got home."],"When I got home, my brother was watching TV."),
C("32",7,"that",`「私はユキは東京に住んでいると思います」I think ${B} Yuki lives in Tokyo.`,["that","what","because"],0,"that「〜ということ」。よく省略される",["I think (that) Yuki lives in Tokyo.","I'm sure (that) 〜 のように、感情や心理の形容詞のあとにも使う"],"I think that Yuki lives in Tokyo."),
C("33",7,"because",`I stayed home ${B} I had a cold.`,["because","before","after"],0,"because「〜なので」",["because … 〜なので","before … 〜する前に","after … 〜したあとで"],"I stayed home because I had a cold."),
C("34",8,"比較級＋than",`Ken is ${B} than Mike.`,["taller","tallest","tall"],0,"比較級＋than「…よりも〜」",["Ken is taller than Mike.（ケンはマイクより背が高い）"],"Ken is taller than Mike."),
C("35",8,"the＋最上級",`This pen is the ${B} of the three.`,["longest","longer","long"],0,"the＋最上級「もっとも〜」",["This pen is the longest of the three.（3本の中でもっとも長い）"],"This pen is the longest of the three."),
C("36",8,"as＋原級＋as",`Yumi is as ${B} as Jane.`,["old","older","oldest"],0,"as〜as の間はもとの形（原級）",["Yumi is as old as Jane.（ユミはジェーンと同じ年齢）"],"Yumi is as old as Jane."),
C("37",8,"not as〜as","「私のバッグはあなたのほど大きくない」を表すのは？",["My bag isn't as big as yours.","My bag is as big as yours."],0,"not as〜as「…ほど〜ない」",["not as＋原級＋as … …ほど〜ない"],"My bag isn't as big as yours."),
C("38",8,"more を使う比較級",`This book is ${B} famous than that one.`,["more","most","much"],0,"長い語は more・most をつける",["famous — more famous — most famous"],"This book is more famous than that one."),
C("39",8,"不規則に変化する語","good の比較級は？",["better","gooder","more good"],0,"good / well — better — best",["good / well — better — best","many / much — more — most"],"good, better, best."),
C("40",8,"比較級のつづり（big）","big の比較級は？",["bigger","biger","more big"],0,"〈短母音＋子音字〉は子音字を重ねて er",["big — bigger — biggest"],"big, bigger, biggest."),
C("41",8,"比較級のつづり（happy）","happy の比較級は？",["happier","happyer","more happy"],0,"〈子音字＋y〉は y を i にかえて er",["happy — happier — happiest","large — larger — largest（e で終わる語は r, st）"],"happy, happier, happiest."),
C("42",9,"受け身の形",`This room is ${B} every day.`,["cleaned","clean","cleaning"],0,"be動詞＋過去分詞「〜される」",["受け身：主語＋be動詞＋過去分詞","This room is cleaned every day.（この部屋は毎日そうじされる）"],"This room is cleaned every day."),
C("43",9,"by 〜",`The book was written ${B} my aunt.`,["by","with","as"],0,"動作をした人は by 〜",["The book was written by my aunt.（その本はおばによって書かれた）"],"The book was written by my aunt."),
C("44",9,"by 以外の前置詞",`The top of the mountain is covered ${B} snow.`,["with","by","as"],0,"be covered with 〜「〜でおおわれている」",["be covered with 〜 … 〜でおおわれている","be known as 〜 … 〜として知られている"],"The top of the mountain is covered with snow."),
C("45",9,"受け身の疑問文",`${B} this song sung by children?`,["Is","Does","Do"],0,"受け身の疑問文はbe動詞を前に",["be動詞＋主語＋過去分詞 〜?","— Yes, 主語＋be動詞. / No, 主語＋be動詞＋not."],"Is this song sung by children?"),
C("46",9,"目的語が2つある受け身",`The cake was made ${B} me by Kazu.`,["for","to","by"],0,"make の受け身では for が必要",["Kazu made me the cake. → The cake was made for me by Kazu.","「人」を主語にできない動詞もある"],"The cake was made for me by Kazu."),
C("47",9,"助動詞を含む受け身",`The room will ${B} cleaned next week.`,["be","is","been"],0,"助動詞＋be＋過去分詞",["The room will be cleaned next week.","A lot of stars can be seen from here."],"The room will be cleaned next week.")
];

let au=null;function play(id){try{if(au)au.pause();au=new Audio("audio/"+id+".m4a");const p=au.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
// ===== 保存 =====
const KEY="eng2-grammar-v1";let mem=null;
function loadS(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return mem}}
function saveS(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=S}}
let S=loadS()||{};S.c=S.c||{};S.days=S.days||[];S.log=S.log||{};S.set=S.set||{newPerDay:3,unit:""};
const GAP=[0,2,4,8,16,32];
const $=()=>document.getElementById("app");
const dstr=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return dstr(d)};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const st=k=>S.c[k.id];const lvOf=k=>st(k)?st(k).lv:0;
const cards=()=>S.set.unit?CARDS.filter(k=>""+k.u===S.set.unit):CARDS;
function streak(){let n=0,d=dstr();const ds=new Set(S.days);if(!ds.has(d))d=addDays(d,-1);while(ds.has(d)){n++;d=addDays(d,-1)}return n}
// ①カードの問題 ②数字を変えた類題（ないカードは同じ問題をもう一度）。②まで正解したら、間をあけて復習
function grade(k,stage,ok,hinted){const t=dstr();const c=S.c[k.id]||(S.c[k.id]={lv:0,box:0,first:t,e:0,h:0});
 const L=S.log[t]||(S.log[t]={ok:0,ng:0,hint:0});if(!S.days.includes(t))S.days.push(t);
 if(ok&&!hinted){L.ok++;c.lv=Math.max(c.lv,stage);c.f=false;if(stage>=2&&c.lv>=2){c.box=Math.min(5,(c.box||0)+1);c.due=addDays(t,GAP[c.box])}else c.due=addDays(t,1)}
 else if(ok){L.hint++;c.h++;c.due=addDays(t,1)}
 else{L.ng++;c.e++;c.f=true;c.box=0;c.due=addDays(t,1);if(c.lv>=2)c.lv=1}
 saveS()}
function plan(){const t=dstr(),cs=cards();const due=cs.filter(k=>st(k)&&st(k).due<=t);
 const todayNew=Object.values(S.c).filter(c=>c.first===t).length;const bonus=(S.bonus&&S.bonus.date===t)?S.bonus.n:0;
 const rest=cs.filter(k=>!st(k));return {due,fresh:rest.slice(0,Math.max(0,(S.set.newPerDay||3)+bonus-todayNew)),left:rest.length}}
// ===== ホーム =====
let ses=null;
function home(){ses=null;const p=plan(),cs=CARDS.filter(k=>st(k)),ok2=cs.filter(k=>lvOf(k)>=2).length;const rev=Math.min(p.due.length,10),any=rev+p.fresh.length>0;
 $().innerHTML=`<h1 style="font-size:20px;margin:6px 0 2px">中2 英文法カード</h1><div class="dim">選ぶ → 解説と音で確かめる → ノートに書く</div>
 <div class="box"><div class="big3"><div><b>${cs.length}</b><span class="dim">はじめた</span></div><div><b>${ok2}</b><span class="dim">できる</span></div><div><b>${streak()}</b><span class="dim">日つづけた</span></div></div>
 <div class="bar" style="margin-top:14px"><i style="width:${cs.length/CARDS.length*100}%"></i></div><div class="dim center" style="margin-top:4px">全${CARDS.length}問（英語要点まとめシートⒶⒷ）</div></div>
 ${any?`<button class="main" onclick="start()">今日の学習をはじめる</button><div class="dim center" style="margin-top:8px">復習 ${rev}問 ＋ 新しいカード ${p.fresh.length}問</div>`
 :`<div class="box center"><div style="font-size:40px">🎉</div><b>今日の分はおわり！</b><div class="dim">つづきは明日。</div></div>${p.left?`<button class="full" onclick="more()">あと3問すすめる</button>`:""}`}
 <button class="full" style="margin-top:22px" onclick="record()">📒 学習の記録を見る</button>
 <div class="center" style="margin-top:6px"><button class="ghost" onclick="settings()">⚙ 設定</button></div><a href="../" style="display:block;margin-top:10px"><button class="full">📇 英単語アプリへもどる</button></a><div class="dim center">版 1</div>`}
function more(){const t=dstr();S.bonus={date:t,n:((S.bonus&&S.bonus.date===t)?S.bonus.n:0)+3};saveS();start()}
// ===== 学習の流れ =====
function start(list){const p=plan();const src=list?shuf(list):[...shuf(p.due).slice(0,10),...p.fresh];const tasks=[];
 src.filter(k=>lvOf(k)>0).forEach(k=>tasks.push({k,stage:2}));
 const fresh=src.filter(k=>lvOf(k)===0);fresh.forEach(k=>tasks.push({k,stage:1}));
 if(!tasks.length){home();return}ses={tasks,n:tasks.length,done:0,wrong:[]};next()}
function next(){if(!ses)return;if(!ses.tasks.length){end();return}const t=ses.cur=ses.tasks.shift();t.hint=false;ses.locked=false;
 const k=t.k;let pr={q:k.q,o:k.o,a:k.a,s:k.s};if(t.stage===2&&k.gen&&!t.retry)pr=k.gen();else if(t.retry&&t.pr)pr=t.pr;
 t.pr=pr;const order=shuf(pr.o.map((_,i)=>i));ses.order=order;
 $().innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><span class="unit">${UNITS[k.u]}　No.${k.no}${t.stage===2?"　（もう一度）":""}</span><button class="ghost" onclick="home()">やめる</button></div>
 <div class="bar"><i style="width:${ses.done/ses.n*100}%"></i></div>
 <div class="box"><div class="ttl">${k.t}</div><div class="q">${pr.q}</div></div>
 <div id="hint"><button class="hintb" onclick="hint()">💡 ヒントを見る</button></div>
 ${order.map((oi,i)=>`<button class="ch" onclick="ans(${i})">${"①②③④"[i]}　${pr.o[oi]}</button>`).join("")}`}
function hint(){if(!ses||ses.locked)return;const t=ses.cur;t.hint=true;document.getElementById("hint").innerHTML=`<div class="tip">💡 ${t.k.tip}</div>`;
 const bs=[...document.querySelectorAll(".ch")];if(bs.length>=3){const i=ses.order.findIndex((oi,j)=>oi!==t.pr.a&&!bs[j].disabled);if(i>=0){bs[i].classList.add("off");bs[i].disabled=true}}}
function ans(i){if(!ses||ses.locked)return;ses.locked=true;const t=ses.cur,k=t.k,ok=ses.order[i]===t.pr.a;
 [...document.querySelectorAll(".ch")].forEach((b,j)=>{if(ses.order[j]===t.pr.a)b.classList.add("ok");else if(j===i)b.classList.add("ng")});
 if(!t.retry)grade(k,t.stage,ok,t.hint);
 if(!ok){if(!t.retry)ses.wrong.push(k);ses.tasks.splice(Math.min(2,ses.tasks.length),0,{k,stage:t.stage,retry:true,pr:t.pr});ses.n++}
 const my=ses;setTimeout(()=>{if(ses!==my)return;explain(t,ok)},ok?500:800)}
function explain(t,ok){const k=t.k,pr=t.pr;
 $().innerHTML=`<div class="unit">${UNITS[k.u]}　No.${k.no}</div>
 <div class="box center" style="font-size:22px;font-weight:bold;color:${ok?"#15803d":"#b91c1c"}">${ok?(t.hint?"⭕ 正解（ヒントあり）":"⭕ 正解！"):"❌ おしい！"}</div>
 <div class="box"><div class="dim">こたえ</div><div class="q" style="font-weight:bold">${pr.o[pr.a]}</div>
 ${k.say?`<button style="margin:6px 0" onclick="play('${k.id}')">🔊 英文を聞く</button><div style="font-size:18px;font-weight:bold">${k.say}</div>`:""}<div class="tip">💡 ${k.tip}</div><div class="steps">${pr.s.map(x=>`<div>${x}</div>`).join("")}</div></div>
 ${ok?"":`<div class="note">✏️ 正しい英文をノートに書き写して、声に出して読もう。あとでもう一度出ます。</div>`}
 <button class="main" onclick="ses.done++;next()">次へ</button>`;if(k.say)setTimeout(()=>play(k.id),200)}
function end(){const u=[...new Map(ses.wrong.map(k=>[k.id,k])).values()],n=ses.n;ses=null;const p=plan();
 $().innerHTML=`<div class="box center"><div style="font-size:48px">🎉</div><h2>おつかれさま！</h2><div>${streak()}日つづいています</div></div>
 ${u.length?`<div class="note"><b>✏️ 自学ノートに書こう</b><br>まちがえた問題の正しい英文をノートに書き、「💡ポイント」を下に1行そえよう。<br><br>${u.map(k=>`No.${k.no}　${k.t}`).join("<br>")}</div>`:`<div class="note">ぜんぶ正解！今日の英文をノートに1回ずつ書いて、声に出して読もう。</div>`}
 ${p.due.length?`<button class="full" style="margin-bottom:10px" onclick="start()">残りの復習 ${p.due.length}問をやる</button>`:(p.left?`<button class="full" style="margin-bottom:10px" onclick="more()">あと3問すすめる</button>`:"")}
 <button class="main" onclick="home()">おわる</button>`}
// ===== 学習の記録（ポートフォリオ） =====
function mark(k){const c=st(k);if(!c)return `<span class="mk dim">まだ</span>`;return `<span class="mk">${c.lv>=1?"①⭕":"①・"} ${c.lv>=2?"②⭕":"②・"}</span>`}
function record(){const cs=CARDS.filter(k=>st(k)),wk=CARDS.filter(k=>st(k)&&st(k).f);
 const days=Object.keys(S.log).sort().slice(-14).reverse();
 $().innerHTML=`<button class="ghost" onclick="home()">◀ もどる</button><h2>📒 学習の記録</h2>
 <div class="box"><b>単元ごとにできるようになった問題</b>${Object.entries(UNITS).map(([u,nm])=>{const all=CARDS.filter(k=>""+k.u===u),ok=all.filter(k=>lvOf(k)>=2).length;return `<div class="lv"><span>${nm}</span><div class="bar"><i style="width:${ok/all.length*100}%"></i></div><b>${ok}/${all.length}</b></div>`}).join("")}
 <div class="dim">「できる」＝1回目（①）と、次の日のもう一度（②）を、ヒントなしで正解。</div></div>
 ${wk.length?`<button class="main" style="min-height:58px;font-size:18px" onclick="start(CARDS.filter(k=>st(k)&&st(k).f))">いま つまずいている ${wk.length}問を練習する</button>`:""}
 ${wk.length?`<h3>つまずいている問題</h3><div class="box" style="padding:6px 16px">${wk.map(k=>`<div class="li"><div style="flex:1"><b>No.${k.no}</b>　${k.t}<div class="dim">まちがい${st(k).e}回　ヒント${st(k).h}回</div></div>${mark(k)}</div>`).join("")}</div>`:""}
 ${days.length?`<h3>日ごとの記録</h3><div class="box" style="padding:6px 16px">${days.map(d=>{const l=S.log[d];return `<div class="li"><div style="flex:1">${d.slice(5).replace("-","/")}</div><div class="dim">正解${l.ok}　ヒント${l.hint}　まちがい${l.ng}</div></div>`}).join("")}</div>`:""}
 <h3>カードごとの記録</h3><div class="box" style="padding:6px 16px">${CARDS.map(k=>`<div class="li"><div style="flex:1"><b>${k.no}</b>　${k.t}${st(k)?`<div class="dim">まちがい${st(k).e}回　ヒント${st(k).h}回</div>`:""}</div>${mark(k)}</div>`).join("")}</div>
 <button class="full" onclick="copyRec()">記録を文字でコピーする</button><div id="cp" class="dim center" style="margin-top:6px"></div>`}
function copyRec(){const plain=s=>s.replace(/<[^>]+>/g,"");
 const txt=`【中2英文法カード 学習の記録 ${dstr()}】\nはじめた ${CARDS.filter(k=>st(k)).length}問／できる ${CARDS.filter(k=>lvOf(k)>=2).length}問／つづけた日数 ${streak()}日\n`+Object.entries(UNITS).map(([u,nm])=>{const all=CARDS.filter(k=>""+k.u===u);return `${nm}：${all.filter(k=>lvOf(k)>=2).length}/${all.length}`}).join("\n")+`\nつまずき：`+(CARDS.filter(k=>st(k)&&st(k).f).map(k=>`No.${k.no} ${plain(k.t)}（まちがい${st(k).e}回）`).join("、")||"なし");
 const done=m=>{const e=document.getElementById("cp");if(e)e.textContent=m};try{navigator.clipboard.writeText(txt).then(()=>done("コピーしました"),()=>done(txt))}catch(e){done(txt)}}
// ===== 設定 =====
function settings(){$().innerHTML=`<button class="ghost" onclick="home()">◀ もどる</button><h2>⚙ 設定</h2><div class="box">
 <label>1日の新しいカード</label><select onchange="S.set.newPerDay=+this.value;saveS()">${[3,5].map(n=>`<option value="${n}" ${(S.set.newPerDay||3)===n?"selected":""}>${n}問</option>`).join("")}</select>
 <label>単元</label><select onchange="S.set.unit=this.value;saveS()"><option value="">すべて</option>${Object.entries(UNITS).map(([u,nm])=>`<option value="${u}" ${S.set.unit===u?"selected":""}>${nm}</option>`).join("")}</select></div>
 <div class="box" style="font-size:15px;line-height:1.7"><b>この進め方の考え方</b><br>・まず自分で答えを選ぶ（思い出す練習）<br>・すぐに解説で確かめる<br>・次の日に、もう一度解いて「わかった」を確かめる<br>・英文は音で聞いて、声に出してまねする<br>・できた問題は、2日・4日・8日…と間をあけて復習<br>・まちがえた問題は、自学ノートに書き写して解き直す</div>`}
home();
</script></body></html>
